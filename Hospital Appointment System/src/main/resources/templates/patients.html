<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patients · MediCare</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="logo">🏥</div>
            <div>
                <h2>MediCare</h2>
                <span>Hospital System</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a th:href="@{/}"><span class="nav-icon">📊</span> <span>Dashboard</span></a>
            <a th:href="@{/doctors-page}"><span class="nav-icon">🩺</span> <span>Doctors</span></a>
            <a th:href="@{/patients-page}" class="active"><span class="nav-icon">🧑‍⚕️</span> <span>Patients</span></a>
            <a th:href="@{/appointments-page}"><span class="nav-icon">📅</span> <span>Appointments</span></a>
        </nav>
        <div class="sidebar-footer">MediCare © 2026</div>
    </aside>

    <div class="main">
        <div class="topbar">
            <div>
                <h1>Patients</h1>
                <p class="subtitle">Patient registration & records</p>
            </div>
        </div>

        <div class="content">
            <div class="toast-container">
                <div class="toast" th:if="${success}" th:text="${success}"></div>
                <div class="error" th:if="${error}" th:text="${error}"></div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>All Patients</h2>
                    <form class="search-bar" th:action="@{/patients-page}" method="get">
                        <input type="search" name="q" th:value="${q}" placeholder="Search name, email, phone…">
                        <button type="submit">Search</button>
                        <a th:if="${q}" th:href="@{/patients-page}" class="btn btn-secondary btn-small">Clear</a>
                    </form>
                </div>
                <div class="card-body">
                    <table>
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Age / Gender</th>
                            <th>Blood</th>
                            <th>Contact</th>
                            <th>Address</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="patient : ${patients}">
                            <td th:text="${patient.id}"></td>
                            <td><strong th:text="${patient.name}"></strong></td>
                            <td th:text="${patient.age} + ' · ' + ${patient.gender != null ? patient.gender : '—'}"></td>
                            <td th:text="${patient.bloodGroup != null ? patient.bloodGroup : '—'}"></td>
                            <td>
                                <div th:text="${patient.email}" style="font-size:0.85rem"></div>
                                <div style="font-size:0.75rem;color:var(--text-muted)" th:text="${patient.phone}"></div>
                            </td>
                            <td style="font-size:0.85rem" th:text="${patient.address != null ? patient.address : '—'}"></td>
                            <td>
                                <div class="row-actions">
                                    <a th:href="@{/patients-page/edit/{id}(id=${patient.id})}" class="btn btn-small btn-edit">Edit</a>
                                    <form th:action="@{/patients-page/delete/{id}(id=${patient.id})}" method="post"
                                          onsubmit="return confirm('Remove this patient?');">
                                        <button type="submit" class="btn btn-small btn-delete">Delete</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr class="empty-row" th:if="${patients.isEmpty()}">
                            <td colspan="7">No patients found. Register one below.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="form-card">
                <h2 th:text="${editPatient != null} ? '✏️ Edit Patient' : '➕ Register New Patient'"></h2>
                <form th:if="${editPatient == null}" th:action="@{/patients-page/add}" method="post">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Full Name *</label>
                            <input type="text" name="name" required placeholder="Patient full name">
                        </div>
                        <div class="form-group">
                            <label>Email *</label>
                            <input type="email" name="email" required placeholder="patient@email.com">
                        </div>
                        <div class="form-group">
                            <label>Phone *</label>
                            <input type="tel" name="phone" required placeholder="10-digit number">
                        </div>
                        <div class="form-group">
                            <label>Age *</label>
                            <input type="number" name="age" required min="0" max="120" placeholder="Age">
                        </div>
                        <div class="form-group">
                            <label>Gender</label>
                            <select name="gender">
                                <option value="">— Select —</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Blood Group</label>
                            <select name="bloodGroup">
                                <option value="">— Select —</option>
                                <option value="A+">A+</option>
                                <option value="A-">A-</option>
                                <option value="B+">B+</option>
                                <option value="B-">B-</option>
                                <option value="O+">O+</option>
                                <option value="O-">O-</option>
                                <option value="AB+">AB+</option>
                                <option value="AB-">AB-</option>
                            </select>
                        </div>
                        <div class="form-group full">
                            <label>Address</label>
                            <input type="text" name="address" placeholder="City, State">
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit">Register Patient</button>
                    </div>
                </form>

                <form th:if="${editPatient != null}" th:action="@{/patients-page/update/{id}(id=${editPatient.id})}" method="post">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Full Name *</label>
                            <input type="text" name="name" required th:value="${editPatient.name}">
                        </div>
                        <div class="form-group">
                            <label>Email *</label>
                            <input type="email" name="email" required th:value="${editPatient.email}">
                        </div>
                        <div class="form-group">
                            <label>Phone *</label>
                            <input type="tel" name="phone" required th:value="${editPatient.phone}">
                        </div>
                        <div class="form-group">
                            <label>Age *</label>
                            <input type="number" name="age" required min="0" max="120" th:value="${editPatient.age}">
                        </div>
                        <div class="form-group">
                            <label>Gender</label>
                            <select name="gender">
                                <option value="">— Select —</option>
                                <option value="Male" th:selected="${editPatient.gender == 'Male'}">Male</option>
                                <option value="Female" th:selected="${editPatient.gender == 'Female'}">Female</option>
                                <option value="Other" th:selected="${editPatient.gender == 'Other'}">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Blood Group</label>
                            <select name="bloodGroup">
                                <option value="">— Select —</option>
                                <option value="A+" th:selected="${editPatient.bloodGroup == 'A+'}">A+</option>
                                <option value="A-" th:selected="${editPatient.bloodGroup == 'A-'}">A-</option>
                                <option value="B+" th:selected="${editPatient.bloodGroup == 'B+'}">B+</option>
                                <option value="B-" th:selected="${editPatient.bloodGroup == 'B-'}">B-</option>
                                <option value="O+" th:selected="${editPatient.bloodGroup == 'O+'}">O+</option>
                                <option value="O-" th:selected="${editPatient.bloodGroup == 'O-'}">O-</option>
                                <option value="AB+" th:selected="${editPatient.bloodGroup == 'AB+'}">AB+</option>
                                <option value="AB-" th:selected="${editPatient.bloodGroup == 'AB-'}">AB-</option>
                            </select>
                        </div>
                        <div class="form-group full">
                            <label>Address</label>
                            <input type="text" name="address" th:value="${editPatient.address}">
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit">Save Changes</button>
                        <a th:href="@{/patients-page}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script th:src="@{/js/app.js}"></script>
</body>
</html>
