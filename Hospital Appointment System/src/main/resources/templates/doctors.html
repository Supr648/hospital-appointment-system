<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctors · MediCare</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="logo">🏥</div>
            <div>
                <h2>MediCare</h2>
                <span>Hospital System</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a th:href="@{/}"><span class="nav-icon">📊</span> <span>Dashboard</span></a>
            <a th:href="@{/doctors-page}" class="active"><span class="nav-icon">🩺</span> <span>Doctors</span></a>
            <a th:href="@{/patients-page}"><span class="nav-icon">🧑‍⚕️</span> <span>Patients</span></a>
            <a th:href="@{/appointments-page}"><span class="nav-icon">📅</span> <span>Appointments</span></a>
        </nav>
        <div class="sidebar-footer">MediCare © 2026</div>
    </aside>

    <div class="main">
        <div class="topbar">
            <div>
                <h1>Doctors</h1>
                <p class="subtitle">Manage hospital doctors & availability</p>
            </div>
        </div>

        <div class="content">
            <div class="toast-container">
                <div class="toast" th:if="${success}" th:text="${success}"></div>
                <div class="error" th:if="${error}" th:text="${error}"></div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>All Doctors</h2>
                    <form class="search-bar" th:action="@{/doctors-page}" method="get">
                        <input type="search" name="q" th:value="${q}" placeholder="Search name, specialty, dept…">
                        <button type="submit">Search</button>
                        <a th:if="${q}" th:href="@{/doctors-page}" class="btn btn-secondary btn-small">Clear</a>
                    </form>
                </div>
                <div class="card-body">
                    <table>
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Specialization</th>
                            <th>Department</th>
                            <th>Exp.</th>
                            <th>Contact</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="doctor : ${doctors}">
                            <td th:text="${doctor.id}"></td>
                            <td>
                                <strong th:text="${doctor.name}"></strong>
                                <div style="font-size:0.75rem;color:var(--text-muted)" th:text="${doctor.qualification}"></div>
                            </td>
                            <td th:text="${doctor.specialization}"></td>
                            <td th:text="${doctor.department}"></td>
                            <td th:text="${doctor.experienceYears} + ' yrs'"></td>
                            <td>
                                <div th:text="${doctor.email}" style="font-size:0.85rem"></div>
                                <div style="font-size:0.75rem;color:var(--text-muted)" th:text="${doctor.phone}"></div>
                            </td>
                            <td>
                                <span class="badge"
                                      th:classappend="${doctor.available} ? 'badge-available' : 'badge-unavailable'"
                                      th:text="${doctor.available} ? 'Available' : 'Unavailable'"></span>
                            </td>
                            <td>
                                <div class="row-actions">
                                    <a th:href="@{/doctors-page/edit/{id}(id=${doctor.id})}" class="btn btn-small btn-edit">Edit</a>
                                    <form th:action="@{/doctors-page/toggle/{id}(id=${doctor.id})}" method="post">
                                        <button type="submit" class="btn btn-small btn-toggle">Toggle</button>
                                    </form>
                                    <form th:action="@{/doctors-page/delete/{id}(id=${doctor.id})}" method="post"
                                          onsubmit="return confirm('Remove this doctor?');">
                                        <button type="submit" class="btn btn-small btn-delete">Delete</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr class="empty-row" th:if="${doctors.isEmpty()}">
                            <td colspan="8">No doctors found. Add one below.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="form-card">
                <h2 th:text="${editDoctor != null} ? '✏️ Edit Doctor' : '➕ Add New Doctor'"></h2>
                <form th:if="${editDoctor == null}" th:action="@{/doctors-page/add}" method="post">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Full Name *</label>
                            <input type="text" name="name" required placeholder="Dr. Full Name">
                        </div>
                        <div class="form-group">
                            <label>Specialization *</label>
                            <input type="text" name="specialization" required placeholder="e.g. Cardiology">
                        </div>
                        <div class="form-group">
                            <label>Email *</label>
                            <input type="email" name="email" required placeholder="doctor@medicare.com">
                        </div>
                        <div class="form-group">
                            <label>Phone</label>
                            <input type="tel" name="phone" placeholder="10-digit number">
                        </div>
                        <div class="form-group">
                            <label>Department</label>
                            <input type="text" name="department" placeholder="e.g. Cardiology">
                        </div>
                        <div class="form-group">
                            <label>Experience (years)</label>
                            <input type="number" name="experienceYears" min="0" max="50" value="0">
                        </div>
                        <div class="form-group">
                            <label>Qualification</label>
                            <input type="text" name="qualification" placeholder="MD, DM…">
                        </div>
                        <div class="form-group">
                            <label>Available</label>
                            <select name="available">
                                <option value="true" selected>Yes</option>
                                <option value="false">No</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit">Add Doctor</button>
                    </div>
                </form>

                <form th:if="${editDoctor != null}" th:action="@{/doctors-page/update/{id}(id=${editDoctor.id})}" method="post">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Full Name *</label>
                            <input type="text" name="name" required th:value="${editDoctor.name}">
                        </div>
                        <div class="form-group">
                            <label>Specialization *</label>
                            <input type="text" name="specialization" required th:value="${editDoctor.specialization}">
                        </div>
                        <div class="form-group">
                            <label>Email *</label>
                            <input type="email" name="email" required th:value="${editDoctor.email}">
                        </div>
                        <div class="form-group">
                            <label>Phone</label>
                            <input type="tel" name="phone" th:value="${editDoctor.phone}">
                        </div>
                        <div class="form-group">
                            <label>Department</label>
                            <input type="text" name="department" th:value="${editDoctor.department}">
                        </div>
                        <div class="form-group">
                            <label>Experience (years)</label>
                            <input type="number" name="experienceYears" min="0" max="50" th:value="${editDoctor.experienceYears}">
                        </div>
                        <div class="form-group">
                            <label>Qualification</label>
                            <input type="text" name="qualification" th:value="${editDoctor.qualification}">
                        </div>
                        <div class="form-group">
                            <label>Available</label>
                            <select name="available">
                                <option value="true" th:selected="${editDoctor.available}">Yes</option>
                                <option value="false" th:selected="${!editDoctor.available}">No</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit">Save Changes</button>
                        <a th:href="@{/doctors-page}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script th:src="@{/js/app.js}"></script>
</body>
</html>
