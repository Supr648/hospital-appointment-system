spring.application.name=appointmentsystem

spring.datasource.url=jdbc:mysql://localhost:3306/hospitaldb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/hospital_activity?serverSelectionTimeoutMS=2000}

server.port=${PORT:8080}
spring.thymeleaf.cache=false